# La topologia completa, en un archivo.
#
# Lo que NO esta aca, a proposito:
#   - Ningun secreto. Viven en .env junto a este archivo, en el VPS, con permisos 0600. El
#     pipeline no los ve, y rotar uno no toca el repositorio.
#   - Ninguna compilacion. Las imagenes llegan hechas desde GHCR, etiquetadas por commit. Lo que
#     corre es exactamente lo que se probo, y volver atras es cambiar una etiqueta.
#
# Cada API aparece dos veces — como migrador de un solo uso y como servicio — porque son la misma
# imagen haciendo dos trabajos. El migrador tiene que TERMINAR BIEN para que la API arranque:
# esa es la unica linea que impide que el codigo nuevo corra sobre un esquema viejo.

name: bit

x-restart: &restart
  restart: unless-stopped

services:

  # --------------------------------------------------------------------- base de datos
  mariadb:
    image: mariadb:11.4
    <<: *restart
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?falta MARIADB_ROOT_PASSWORD en .env}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-platform}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-platform}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?falta PLATFORM_DB_PASSWORD en .env}
      PIMA_DB_NAME: ${PIMA_DB_NAME:-pima}
      PIMA_DB_USER: ${PIMA_DB_USER:-pima}
      PIMA_DB_PASSWORD: ${PIMA_DB_PASSWORD:?falta PIMA_DB_PASSWORD en .env}
      TOURISM_DB_NAME: ${TOURISM_DB_NAME:-tourism}
      TOURISM_DB_USER: ${TOURISM_DB_USER:-tourism}
      TOURISM_DB_PASSWORD: ${TOURISM_DB_PASSWORD:?falta TOURISM_DB_PASSWORD en .env}
      BIDA_DB_NAME: ${BIDA_DB_NAME:-automotive}
      BIDA_DB_USER: ${BIDA_DB_USER:-automotive}
      BIDA_DB_PASSWORD: ${BIDA_DB_PASSWORD:?falta BIDA_DB_PASSWORD en .env}
    volumes:
      - mariadb-data:/var/lib/mysql
      # Se ejecuta UNA sola vez, cuando el volumen esta vacio. Ver db/init/01-databases.sh.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Un contenedor levantado no es un servidor que responde, y el migrador es lo primero que
    # pregunta. Sin esto, el primer despliegue sobre un volumen nuevo es una carrera.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [data]

  # --------------------------------------------------------------------- migraciones
  platform-migrate:
    image: ghcr.io/${GHCR_OWNER:?falta GHCR_OWNER en .env}/pimaplatform:${PLATFORM_TAG:-latest}
    command: ["Platform.Migrator.dll"]
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${PLATFORM_DB_NAME:-platform};User=${PLATFORM_DB_USER:-platform};Password=${PLATFORM_DB_PASSWORD};"
    depends_on:
      mariadb: { condition: service_healthy }
    networks: [data]

  pima-migrate:
    image: ghcr.io/${GHCR_OWNER}/pimacore:${PIMA_TAG:-latest}
    command: ["Pima.Migrator.dll"]
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${PIMA_DB_NAME:-pima};User=${PIMA_DB_USER:-pima};Password=${PIMA_DB_PASSWORD};"
    depends_on:
      mariadb: { condition: service_healthy }
    networks: [data]

  tourism-migrate:
    image: ghcr.io/${GHCR_OWNER}/tourismcore:${TOURISM_TAG:-latest}
    command: ["Tourism.Migrator.dll"]
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${TOURISM_DB_NAME:-tourism};User=${TOURISM_DB_USER:-tourism};Password=${TOURISM_DB_PASSWORD};"
    depends_on:
      mariadb: { condition: service_healthy }
    networks: [data]

  # La segunda vertical, y **lo que hizo falta agregar acá es todo lo que hizo falta agregar**:
  # un migrador, un servicio, una base y un par de credenciales. Ni Platform ni PIMA cambiaron —
  # el motor no sabe que existen verticales y la plataforma sólo tiene una fila más en su tabla
  # de líneas de negocio.
  bida-migrate:
    image: ghcr.io/${GHCR_OWNER}/automotivecore:${BIDA_TAG:-latest}
    command: ["Automotive.Migrator.dll"]
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${BIDA_DB_NAME:-automotive};User=${BIDA_DB_USER:-automotive};Password=${BIDA_DB_PASSWORD};"
    depends_on:
      mariadb: { condition: service_healthy }
    networks: [data]

  # --------------------------------------------------------------------- servicios
  platform-api:
    image: ghcr.io/${GHCR_OWNER}/pimaplatform:${PLATFORM_TAG:-latest}
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${PLATFORM_DB_NAME:-platform};User=${PLATFORM_DB_USER:-platform};Password=${PLATFORM_DB_PASSWORD};"
      Jwt__Issuer: ${JWT_ISSUER:-https://platform.local}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?falta JWT_SIGNING_KEY en .env}
      # Sin el secreto del webhook la API se niega a arrancar, y eso es deliberado: la
      # notificacion de pago es su unica ruta anonima y sin secreto no tiene contra que verificar.
      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN:?falta MERCADOPAGO_ACCESS_TOKEN en .env}
      MercadoPago__WebhookSecret: ${MERCADOPAGO_WEBHOOK_SECRET:?falta MERCADOPAGO_WEBHOOK_SECRET en .env}
      # Correo saliente. **El interruptor es el host**: sin `Email__Smtp__Host`, Platform registra
      # `LoggingEmailSender` y se limita a anotar en el log que *habria* mandado el correo — asi
      # que nadie puede confirmar su direccion ni recuperar su contrasena, y no falla nada.
      #
      # Hasta hoy este bloque pasaba **una sola** variable, `Email__SmtpPassword`, y ademas con
      # el nombre equivocado: la opcion es `Email:Smtp:Password`, o sea `Email__Smtp__Password`
      # con dos guiones bajos. La que habia no ligaba con ninguna clase, asi que el despliegue no
      # tenia correo por dos motivos a la vez.
      #
      # `FromAddress` es la direccion **desde la que salen** los mensajes, y es obligatoria en
      # cuanto hay host: Platform se niega a arrancar si esta vacia, porque un host configurado
      # sin remitente es una configuracion a medias y no una decision.
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-PIMA}
      # SMS, con la misma forma y el mismo defecto corregido: la opcion es `Sms:ClientSecret`,
      # no `Sms:Password`. Sin `Sms__Endpoint` el canal queda en su stand-in.
      Sms__Endpoint: ${SMS_ENDPOINT:-}
      Sms__ClientId: ${SMS_CLIENT_ID:-}
      Sms__ClientSecret: ${SMS_CLIENT_SECRET:-}
      # El primer administrador de plataforma, y el unico paso que no se puede hacer desde el
      # producto: conceder el rol de plataforma exige ya tenerlo. Estaba construido en Platform
      # desde la Iteracion 1 y **este compose no lo invocaba**, asi que un despliegue nuevo
      # levantaba con los roles sembrados y cero administradores, sin salida.
      #
      # Apagado por defecto, y esa es la mitad importante: un bootstrap siempre encendido con una
      # contrasena vieja en el `.env` es una cuenta conocida que viaja con el despliegue. Se
      # enciende una vez, se entra, y se vuelve a apagar.
      #
      # No se marcan obligatorias con `:?` porque el caso normal es que esten vacias. Quien
      # valida es Platform, que es donde la regla puede ser condicional: enciende y sin
      # contrasena avisa y no hace nada, y con menos de 12 caracteres **se niega** — esta cuenta
      # tiene todos los permisos de la plataforma.
      Bootstrap__Enabled: ${BOOTSTRAP_ENABLED:-false}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:-}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
    depends_on:
      platform-migrate: { condition: service_completed_successfully }
    networks: [data, services, edge]

  pima-api:
    image: ghcr.io/${GHCR_OWNER}/pimacore:${PIMA_TAG:-latest}
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${PIMA_DB_NAME:-pima};User=${PIMA_DB_USER:-pima};Password=${PIMA_DB_PASSWORD};"
      Jwt__Issuer: ${JWT_ISSUER:-https://platform.local}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Platform__BaseUrl: http://platform-api:8080
      Platform__ClientId: ${PIMA_CLIENT_ID:?falta PIMA_CLIENT_ID en .env}
      Platform__ClientSecret: ${PIMA_CLIENT_SECRET:?falta PIMA_CLIENT_SECRET en .env}
      Trustfull__ApiKey: ${TRUSTFULL_API_KEY:-}
      # Fuera del contenido estatico de la aplicacion, y sobre un volumen propio: la evidencia de
      # una denuncia son documentos de identidad, y en el legacy se servian sin token por estar
      # dentro de wwwroot.
      Reports__EvidenceRoot: /var/lib/pima/evidence
    volumes:
      - pima-evidence:/var/lib/pima/evidence
    depends_on:
      pima-migrate: { condition: service_completed_successfully }
      platform-api: { condition: service_started }
    # Sin `edge`: a PIMA solo lo llaman servicios, asi que el proxy no puede alcanzarlo aunque
    # alguien escriba la regla. `services` le da la salida a internet que si necesita — es quien
    # llama al proveedor de evidencia.
    networks: [data, services]

  tourism-api:
    image: ghcr.io/${GHCR_OWNER}/tourismcore:${TOURISM_TAG:-latest}
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${TOURISM_DB_NAME:-tourism};User=${TOURISM_DB_USER:-tourism};Password=${TOURISM_DB_PASSWORD};"
      Jwt__Issuer: ${JWT_ISSUER:-https://platform.local}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Platform__BaseUrl: http://platform-api:8080
      Platform__ClientId: ${TOURISM_CLIENT_ID:?falta TOURISM_CLIENT_ID en .env}
      Platform__ClientSecret: ${TOURISM_CLIENT_SECRET:?falta TOURISM_CLIENT_SECRET en .env}
      Pima__BaseUrl: http://pima-api:8080
    depends_on:
      tourism-migrate: { condition: service_completed_successfully }
      pima-api: { condition: service_started }
    networks: [data, services]

  # No esta en `edge`, igual que las otras dos APIs internas: a una vertical la llama la consola
  # por la red de servicios, y su superficie publica —la ficha de un vendedor— la sirve quien
  # tenga que servirla. Publicarla por accidente pide dos cambios y no uno.
  bida-api:
    image: ghcr.io/${GHCR_OWNER}/automotivecore:${BIDA_TAG:-latest}
    <<: *restart
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${BIDA_DB_NAME:-automotive};User=${BIDA_DB_USER:-automotive};Password=${BIDA_DB_PASSWORD};"
      Jwt__Issuer: ${JWT_ISSUER:-https://platform.local}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Platform__BaseUrl: http://platform-api:8080
      Platform__ClientId: ${BIDA_CLIENT_ID:?falta BIDA_CLIENT_ID en .env}
      Platform__ClientSecret: ${BIDA_CLIENT_SECRET:?falta BIDA_CLIENT_SECRET en .env}
      Pima__BaseUrl: http://pima-api:8080
    depends_on:
      bida-migrate: { condition: service_completed_successfully }
      pima-api: { condition: service_started }
    networks: [data, services]

  # **El frontend es una sola aplicacion: la consola.**
  #
  # Los sitios publicos —el de cada vertical y el de la plataforma— son estaticos, estan hechos
  # en Astro y viven en otro repositorio; entran a este producto enlazando el inicio de sesion y
  # el alta de la consola. Asi que lo que se despliega aca es lo unico que necesita una sesion,
  # y la propiedad de seguridad que antes habia que comprobar entre tres imagenes ahora es
  # estructural: **no hay otra app a la que se le pudiera escapar una cookie**.
  console:
    image: ghcr.io/${GHCR_OWNER}/console:${CONSOLE_TAG:-latest}
    <<: *restart
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      # Con qué se sella la cookie de sesión. Obligatoria: sin ella la consola se niega a
      # arrancar, a propósito — un valor por defecto sería una contraseña compartida por toda
      # instalación que se olvidara de poner la suya, o sea una cookie que parece sellada.
      # Sólo la consola la lleva: las dos apps públicas son anónimas y no tienen qué sellar.
      NUXT_SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET en .env}
      # El navegador no habla con las APIs: el proxy de Nitro las alcanza por la red interna.
      NUXT_PLATFORM_API_URL: http://platform-api:8080
      NUXT_BIT_API_URL: http://tourism-api:8080
      # El motor, que sólo la consola alcanza y sólo por la red interna: no está publicado y no
      # va a estarlo. La sesión no le sirve tal cual — rechaza un token de Platform por
      # audiencia — así que el proxy la intercambia contra Platform por uno emitido para esta
      # audiencia, y de ahí que el nombre viaje como configuración en vez de ser un literal en
      # tres repositorios.
      NUXT_PIMA_API_URL: http://pima-api:8080
      NUXT_BIDA_API_URL: http://bida-api:8080
      NUXT_PIMA_AUDIENCE: PimaCore.Services
      # Adónde vuelve el enlace del encabezado. Público porque el navegador lo sigue.
      # El sitio publico, que ya no lo despliega este compose: es estatico, esta hecho en Astro
      # y vive en otro repositorio. La consola sale hacia el por esta URL y no necesita saber
      # nada mas. URL completa y no un dominio, porque puede estar en cualquier host y esquema.
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?falta PUBLIC_SITE_URL en .env}
      # La misma audiencia, del lado del navegador: el menú la necesita para leer en /auth/me si
      # esta sesión puede moderar. Es un identificador público, no una dirección ni un secreto.
      NUXT_PUBLIC_ENGINE_AUDIENCE: PimaCore.Services
    depends_on:
      platform-api: { condition: service_started }
      tourism-api: { condition: service_started }
      pima-api: { condition: service_started }
    networks: [services, edge]

  caddy:
    image: caddy:2-alpine
    <<: *restart
    ports:
      - "127.0.0.1:7085:80"
    environment:
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?falta CONSOLE_DOMAIN en .env}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?falta PLATFORM_DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Los certificados sobreviven a un redespliegue. Sin esto, cada `up` vuelve a pedirlos y
      # Let's Encrypt tiene limites.
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

# Tres redes, y la que importa es la primera.
#
#   data     — la base y quien la consulta. `internal: true`, asi que la base de datos NO TIENE
#              RUTA A INTERNET. Es la unica de las tres marcada asi, porque es la unica donde eso
#              no le quita nada a nadie: PIMA y Platform si necesitan salir, a su proveedor de
#              evidencia y al gateway de pagos.
#   services — servicio con servicio, mas esa salida. Ningun puerto publicado: no se llega desde
#              afuera.
#   edge     — lo unico que el proxy alcanza. PIMA y BIT no estan aca, asi que publicarlos por
#              accidente pide dos cambios y no uno.
networks:
  data:
    internal: true
  services:
  edge:

volumes:
  mariadb-data:
  pima-evidence:
  caddy-data:
  caddy-config:
