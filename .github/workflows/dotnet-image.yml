# Construir y publicar la imagen de una de las tres APIs.
#
# Existe una sola vez y los tres repos la invocan, porque el dia que cambie como se construye una
# imagen no deberia haber tres lugares que corregir. Cada repo aporta ocho lineas: que solucion
# probar y como se llama su imagen.
#
# Las pruebas corren ANTES de publicar. Una imagen que llego a GHCR es una imagen cuyas pruebas
# pasaron, y eso es lo que hace que `latest` sea usable.

name: dotnet-image

on:
  workflow_call:
    inputs:
      solution:
        description: Solucion a restaurar y probar (por ejemplo Platform.sln)
        required: true
        type: string
      image:
        description: Nombre de la imagen en GHCR (por ejemplo pimaplatform)
        required: true
        type: string
    secrets:
      KIT_READ_TOKEN:
        description: >-
          PAT de alcance fino con `Contents: Read` sobre el repo que se construye **y** sobre el
          kit. Solo lo necesitan las verticales, que montan el kit como submodulo privado. Un repo
          sin submodulos no lo pasa y el checkout cae al GITHUB_TOKEN propio.
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Alcanza para publicar en GHCR con el GITHUB_TOKEN del propio workflow: ni un secreto que
      # crear, ni uno que rotar.
      packages: write

    steps:
      # Con submodulos: las verticales montan el kit compartido en `kit/`, y sus proyectos lo
      # referencian por ruta relativa. Sin esta linea el checkout deja la carpeta vacia y
      # **`dotnet restore` no falla** — omite el ProjectReference que no encuentra y devuelve
      # exito —, asi que el pipeline muere despues, en el build, con una pared de CS0246 que
      # nombra tipos y nunca nombra la carpeta que falta. Un repo sin submodulos no paga nada.
      #
      # Y el token, que es lo que faltaba: el GITHUB_TOKEN de un workflow esta acotado a **su**
      # repositorio, asi que no puede clonar otro repositorio privado de la misma organizacion — y
      # GitHub contesta `not found` en vez de `forbidden`, que es por lo que el mensaje despista.
      # El checkout usa el mismo token para el repo principal y para sus submodulos de github.com,
      # de modo que el PAT necesita `Contents: Read` sobre los dos.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.KIT_READ_TOKEN || github.token }}

      # Que un submodulo este declarado no prueba que este. `checkout` registra el que no pudo
      # clonar y sigue; `dotnet restore` omite su ProjectReference y devuelve exito. Las dos
      # herramientas a las que les falta la pieza callan, y el rojo aparece treinta lineas despues
      # nombrando tipos y nunca la carpeta vacia. Esto lo convierte en un rojo que dice su causa.
      #
      # La lista sale de `.gitmodules` y no escrita a mano: un repo sin submodulos no paga nada, y
      # el dia que una vertical monte un segundo, entra solo.
      - name: Todo submodulo declarado tiene contenido
        run: |
          [ -f .gitmodules ] || { echo "Este repo no declara submodulos."; exit 0; }
          paths=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | cut -d' ' -f2-)
          vacios=
          for p in $paths; do
            [ -n "$(ls -A "$p" 2>/dev/null)" ] || vacios="$vacios $p"
          done
          if [ -n "$vacios" ]; then
            echo "::error::Submodulo declarado y vacio:$vacios — el checkout no pudo clonarlo. Si es privado, revisa el secreto KIT_READ_TOKEN."
            exit 1
          fi
          echo "Submodulos con contenido:$paths"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore ${{ inputs.solution }}

      # Sin incremental: un build incremental esconde warnings, y en este proyecto ya se
      # informaron mal dos veces por eso.
      - run: dotnet build ${{ inputs.solution }} --no-restore --no-incremental -c Release

      - run: dotnet test ${{ inputs.solution }} --no-build -c Release --verbosity normal

      - uses: docker/setup-buildx-action@v3

      - name: Convertir owner a minúsculas
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # El commit, adentro del binario. `.git/` no viaja en el contexto de build —y no debe—,
          # asi que sin esto la version que el servicio registra al arrancar sale sin commit y
          # «¿se re-desplego lo que acabo de pushear?» no se puede contestar mirando el log.
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          # El SHA es lo que hace trivial volver atras; `latest` es lo que el compose toma por
          # defecto. Las dos etiquetas apuntan a la misma imagen.
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/${{ inputs.image }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER }}/${{ inputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
