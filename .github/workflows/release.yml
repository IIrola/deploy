# Desplegar: traer las imagenes y levantar.
#
# No compila nada y no lleva ningun secreto. Corre en el runner self-hosted que ya vive en el VPS,
# asi que tampoco hay una clave SSH que guardar en GitHub. Los valores de produccion estan en el
# .env que hay al lado del compose, y este workflow no los lee.
#
# El legacy hacia `rsync` del codigo fuente y compilaba en el VPS. Eso significaba que lo
# desplegado no era exactamente lo probado, y que no habia artefacto al que volver.

name: release

on:
  workflow_dispatch:
  
  repository_dispatch:
    types: [image-published]
  # Cada repo de codigo puede avisar cuando publico su imagen. Se deja apagado hasta que el
  # despliegue automatico sea lo que se quiere: un `dispatch` manual es un buen lugar para
  # empezar.
  # repository_dispatch:
  #   types: [image-published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    defaults:
      run:
        working-directory: /opt/bit

    steps:
      - name: Validar entorno VPS (.env y compose)
        run: |
          test -f .env || { echo "ERROR: Falta el archivo .env en /opt/bit"; exit 1; }
          test -f docker-compose.yml || test -f compose.yaml || { echo "ERROR: Falta docker-compose.yml en /opt/bit"; exit 1; }

      # Traer el compose de este repositorio antes de levantar.
      #
      # **Faltaba, y el sintoma no se parece a la causa.** Este workflow corre dentro de /opt/bit
      # —un clon de este repo— y hacia `pull` de las imagenes y `up`, sin actualizar nunca el
      # compose. Asi que un cambio al compose se pusheaba, el release corria en verde, y en
      # produccion seguia corriendo el archivo viejo: las variables nuevas no se le pasaban a
      # ningun contenedor. Alguien pone el valor en el .env, comprueba que esta, y no pasa nada —
      # que es exactamente como se descubrio, con el correo saliente.
      #
      # `--ff-only` a proposito: si alguien edito el compose en el VPS, esto **falla** en vez de
      # fusionar a ciegas. Un despliegue que resuelve un conflicto solo no es un despliegue.
      # El .env no se toca: esta en .gitignore y vive unicamente en el VPS.
      - name: Actualizar el compose desde el repositorio
        run: |
          git fetch origin
          git pull --ff-only
          echo "compose en $(git rev-parse --short HEAD)"

      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Descargar imágenes actualizadas
        run: docker compose pull

      - name: Desplegar contenedores y esperar estado saludable
        # --wait asegura que los healthchecks pasen antes de dar el paso por exitoso
        run: docker compose up -d --remove-orphans --wait

      - name: Verificar estado de los servicios
        run: docker compose ps

      - name: Limpiar imágenes huérfanas
        if: always()
        run: docker image prune -f

      - name: Cerrar sesión de Docker
        if: always()
        run: docker logout ghcr.io
